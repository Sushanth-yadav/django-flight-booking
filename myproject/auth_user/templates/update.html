{% extends 'main.html' %}

{% block abc %}

<style>
    body{
        margin:0;
        font-family:Arial, sans-serif;
        background:#f4f7fc;
    }

    .update-wrapper{
        display:flex;
        justify-content:center;
        align-items:flex-start;
        padding-top:40px;
        min-height:100vh;
    }

    .update-card{
        background:#fff;
        padding:30px 40px;
        border-radius:12px;
        border:1px solid #ddd;
        box-shadow:0 4px 15px rgba(0,0,0,0.1);
        width:100%;
        max-width:500px;
    }

    .update-title{
        text-align:center;
        margin-bottom:20px;
        color:#0d3b66;
    }

    .form-group{
        margin-bottom:15px;
    }

    .form-group label{
        display:block;
        font-weight:bold;
        color:#1f3c5c;
        margin-bottom:6px;
    }

    .form-group input{
        width:100%;
        padding:10px;
        border:1px solid #ddd;
        border-radius:6px;
        font-size:14px;
        outline:none;
    }

    .form-group input:focus{
        border-color:#1976d2;
    }

    .btn{
        width:100%;
        padding:12px;
        background:#1976d2;
        color:white;
        border:none;
        border-radius:6px;
        font-size:15px;
        cursor:pointer;
        transition:0.3s;
        margin-top:10px;
    }

    .btn:hover{
        background:#125aa0;
    }
</style>

<div class="update-wrapper">

    <div class="update-card">

        <h2 class="update-title">Update Profile</h2>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>First Name</label>
                <input type="text" name="fname" value="{{data.first_name}}">
            </div>

            <div class="form-group">
                <label>Last Name</label>
                <input type="text" name="lname" value="{{data.last_name}}">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" value="{{data.email}}">
            </div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="uname" value="{{data.username}}">
            </div>

            <button type="submit" class="btn">Update</button>

        </form>

    </div>

</div>

{% endblock %}
