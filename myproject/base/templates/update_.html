{% extends 'main.html' %}
{% block abc %}

<style>
    body{
        background:#f4f7fc;
        font-family:Arial, sans-serif;
        margin:0;
    }

    .page-wrapper{
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
    }

    .booking-container{
        width:100%;
        max-width:600px;
        background:white;
        padding:40px;
        border-radius:10px;
        box-shadow:0px 3px 15px rgba(0,0,0,0.1);
    }

    .section-title{
        color:#1976d2;
        border-bottom:2px solid #1976d2;
        padding-bottom:10px;
        margin-bottom:25px;
        text-align:center;
    }

    .form-group{
        margin-bottom:20px;
    }

    .form-group label{
        display:block;
        font-weight:600;
        margin-bottom:8px;
        color:#1f3c5c;
    }

    .form-group input,
    .form-group select{
        width:100%;
        padding:12px;
        border:1px solid #ddd;
        border-radius:6px;
        font-size:15px;
        box-sizing:border-box;
    }

    .form-group input:focus,
    .form-group select:focus{
        outline:none;
        border-color:#1976d2;
    }

    .submit-btn{
        width:100%;
        background:#28a745;
        color:white;
        border:none;
        padding:14px;
        font-size:18px;
        border-radius:6px;
        cursor:pointer;
        margin-top:20px;
    }

    .submit-btn:hover{
        background:#218838;
    }
</style>

<div class="page-wrapper">
    <div class="booking-container">
        <form method="POST">
            {% csrf_token %}

            <h2 class="section-title">Update Passenger Details</h2>

            <div class="form-group">
                <label>Your Name</label>
                <input type="text" name="yname" required value="{{i.name}}">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required value="{{i.email}}">
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="number" name="pnum" required value="{{i.pnum}}">
            </div>

            <div class="form-group">
                <label>Aadhar Number</label>
                <input type="text" name="aadhar" required value="{{i.aadhar}}">
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number" name="age" required value="{{i.age}}">
            </div>

            <div class="form-group">
                <label>Seat Class</label>
                <select name="sclass" required>
                    <option value="">Select seat class</option>
                    <option value="Economy">Economy</option>
                    <option value="Business">Business</option>
                    <option value="First Class">First Class</option>
                </select>
            </div>

            <div class="form-group">
                <label>Seat Number</label>
                <input type="text" name="snum" required value="{{i.seatno}}">
            </div>

            <button type="submit" class="submit-btn">Update</button>
        </form>
    </div>
</div>

{% endblock %}
